name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.14'
      - name: TypeScript build and tests
        working-directory: clients/typescript
        run: npm ci && npm run build && npm test
      - name: Go checks
        working-directory: clients/go
        run: go vet ./... && go test ./...
      - name: Python tests
        run: uv run --frozen --project clients/python pytest -q
      - name: Validate case files
        run: uv run --frozen --project clients/python python conformance/validate_cases.py
      - name: Cross-library conformance
        run: conformance/run.sh --require-all
