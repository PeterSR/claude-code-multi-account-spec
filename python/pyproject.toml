[project]
name = "claude-code-multi-account-core"
version = "0.2.2"
description = "Store and address several Claude Code accounts on one machine (library for the claude-code-multi-account spec)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = ["Typing :: Typed"]

[project.urls]
Repository = "https://github.com/PeterSR/claude-code-multi-account-spec"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_multi_account"]

[tool.pytest.ini_options]
testpaths = ["tests"]
